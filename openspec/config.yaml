# OpenSpec config for ~/nix.
#
# `context:` and `rules:` here are injected into artifact prompts for every
# change made against this root. Keep it to facts a spec author must not get
# wrong; capabilities own their own details.

schema: spec-driven

context: |
  PURPOSE
  A fresh, minimal NixOS build for the netcup VPS, declared as a devenv
  Machine. The first milestone is deliberately narrow: prove the DISKO LAYOUT
  and the INSTALL PROCEDURE, and nothing else. The installed host must boot and
  be reachable over SSH; there is no tailnet and no secret provider in the path
  until that is working. Every later concern (tailnet access, hardening,
  secrets, snapshotting, agent tooling) is a separate change that adds exactly
  one moving part.

  The previous implementation at ~/projects/nixos is a REFERENCE, not truth:
  its ADRs and module split were decided against a different host and a
  different direction, and none of them may be inherited by copying.

  STACK
  - Nix / NixOS. The host configuration is declared as `machines.<name>` in
    devenv.nix (devenv 2.4+), not as a `flake.nix` `nixosConfigurations`
    entry. Flakes remain available for input pinning.
  - devenv owns the module list for a machine: nixpkgs.hostPlatform, then
    `disko.nixosModules.disko`, then devenv's internal recovery + facts
    modules, then our `nixos` module. It evaluates with
    `specialArgs = { inherit inputs self; }`.
  - disko owns the disk layout. `inputs.disko` in devenv.yaml is MANDATORY for
    every NixOS machine because devenv imports the module itself; there is no
    user-facing disko option. Supply `disko.devices` from our own module.
  - secretspec 0.21+ with the **1Password** provider (`onepassword://<vault>`,
    or `onepassword+token://<vault>` for a service account with
    `OP_SERVICE_ACCOUNT_TOKEN`). NOT Proton Pass. Items are addressed through a
    secret's `ref` (section/field), never in the provider URI.

  TARGET HOST
  Netcup VPS, QEMU/KVM guest: 12 vCPU, 32 GiB RAM, one virtio boot disk
  (/dev/vda, 1 TiB), UEFI enabled in the provider panel, no nested
  virtualization (no /dev/kvm — never design a VM-based mechanism for this
  host). Public IPv4 152.53.92.126. The operator wipes it to a fresh
  Debian/Ubuntu with root SSH open before each install attempt; root SSH is the
  one-time install path.

  IDENTITY
  The host identity is the 1Password `dev` vault item `SSH Key` — ed25519,
  fingerprint SHA256:HvoLYt+w9VdcQPwLsF72g9/BZRlwjIaNkHkhJuNHqIQ — NOT the
  workstation's own ~/.ssh/id_ed25519 (SHA256:DnpZNFST…), which is a different
  key. Materialize the private half per use with `op inject` into a 0600 file;
  never an environment variable, never in the repo, never in the Nix store. The
  injected value has NO trailing newline — append one or `ssh-keygen` reports
  "invalid format". Prove identity by fingerprint, never by printing key
  material.

  HARD CONSTRAINTS (learned, do not re-litigate)
  - `devenv machines install` and `deploy` require ROOT SSH to the target.
    A configuration that sets PermitRootLogin = "no" and gives root no key or
    password cannot be installed by Machines — measured: rootLogin "no" plus
    installCheck.hasRootAuth = false. Opening root SSH for the install and
    hardening it after is the working assumption; state the decision explicitly
    in the design when a change touches it.
  - A module may NOT set `nixpkgs.config` for a Machine. Devenv creates the
    pkgs instance outside the module system (it passes
    `pkgs = inputs.nixpkgs.legacyPackages.<system>`), so any module writing
    nixpkgs.config fails eval with "Your system configures nixpkgs with an
    externally created instance". Put such policy in devenv.yaml
    (`allow_unfree: true`) instead.
  - A Machine does NOT build against a flake's nixpkgs pin. It builds against
    devenv.yaml's `inputs.nixpkgs`. If the flake pin matters, say how it is
    reconciled — it does not happen by itself.
  - Every `devenv machines` invocation, read-only ones included, resolves the
    whole secretspec profile. A change that adds a secret makes that secret a
    prerequisite for merely inspecting the machine.
  - Never put a secret literal in a Nix module: it lands in the world-readable
    Nix store. `install.secrets` (SecretSpec) is the only pre-first-boot path;
    secret source paths must be STRINGS ("secrets/server.key"), never Nix path
    literals (./secrets/server.key), which copy their contents into the store.

  CONVENTIONS
  - Specs before code. Every change starts as an OpenSpec proposal and lands
    with `openspec validate`.
  - `~/projects/nixos` (the previous implementation) is a REFERENCE, not
    truth. Its ADRs, module split and comments were decided against a different
    host and a different direction; reuse what earns it and say so, but never
    inherit a decision by copying it.
  - Prefer the smallest configuration that reaches the milestone. Tooling
    graduates into the host config only after it proves durable.

rules:
  proposal:
    - State the milestone this change advances, and the non-goals explicitly.
    - Name anything the change drops or contradicts in ~/projects/nixos.
  design:
    - Cite measured facts with the exact command that produced them and the
      version it ran against (devenv, nixpkgs revision, secretspec).
    - Name every assumption the change makes about the live host or the vault,
      and what breaks if it is wrong.
  tasks:
    - Each task must be independently verifiable, with the command that
      verifies it.
    - Nothing that touches the live host may be a task without a prior
      eval-or-check task that passes.

# No cross-store references: this root is authoritative for this build, and a
# `store:` pointer would make another store the planning root for every command
# run here. The wiki is read-only reference material, not a spec store.