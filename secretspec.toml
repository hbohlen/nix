# secretspec.toml — the secrets this project's provisioning work resolves.
#
# Values live in the 1Password `dev` vault and are read through a service
# account. This manifest holds declarations only: a name, a description, and the
# vault item each secret reads. Never a value.
#
# WHY THE MANIFEST IS IN THE TREE AT ALL, AND WHAT IT COSTS
# `devenv machines install` can write bootstrap files into a freshly installed
# system from SecretSpec values (`install.secrets` in devenv.nix). That is the
# only mechanism that makes the tailnet enrollment a property of the MACHINE
# rather than a step in an operator's session — and enrollment has to survive an
# unattended first boot, because the hardening change that follows will close
# public SSH.
# The cost is measured and accepted: with a manifest in the tree, EVERY
# `devenv machines` invocation — read-only `info` included — resolves the whole
# profile, so the vault becomes a prerequisite for merely inspecting the machine.
# `~/projects/nixos` measured the same trap; devenv.yaml carries the note from
# the other direction.
#
# THE SERVICE ACCOUNT IS READ-ONLY (measured 2026-09-27)
# `op item create` fails with `(101) You do not have permission to perform this
# action` for every category tried and both vault-addressing forms, while
# `op item get` and `op item list` succeed. Items are therefore created by hand
# in the 1Password app, and nothing in this repository writes to the vault.
#
# FIELD ADDRESSING USES THE ITEM'S OWN LABEL, NOT A GUESS
# The 1Password provider reads a field by its label or id, so `ref` must name a
# field the item actually has. Measured 2026-09-27: `TS_AUTH_KEY` is an
# `API_CREDENTIAL` whose concealed field is labelled `credential`. Addressing it
# as `password` fails with
#   item 'dev/TS_AUTH_KEY' does not have a field 'password'
# Before changing any `ref`, read the item's field ids — through a filter, never
# bare, because `op item get <item> --format json` prints concealed values:
#   op item get TS_AUTH_KEY --vault dev --format json | <redacting filter>
#
# PROVIDER FORM
# `onepassword+token://<vault>` is the service-account form: it reads
# OP_SERVICE_ACCOUNT_TOKEN from the environment instead of prompting, which is
# what makes this non-interactive. On the workstation that token is injected by
# the agent runtime; a bb terminal pane does NOT inherit it, so anything needing
# the vault and run in a pane must export it first (scripts/bb-pane-run.sh does).
#
# require_reason = true
# Every access then carries an audited reason, which is what makes the preflight
# and the store sweep legible in the vault's own access log.

[project]
name = "nix"
revision = "1.0"

# require_reason = true — AND WHAT IT COSTS (measured 2026-09-27)
# Every access carries an audited reason, which is what makes the preflight and
# the store sweep legible in the vault's own access log. The cost is real and
# measured: `devenv` DOES NOT FORWARD A REASON FLAG (there is no `--reason` on
# the devenv CLI), so with this set to true EVERY `devenv machines …` invocation
# — read-only `info` and `status` included — fails with
#
#   × Accessing secrets requires a reason. Provide one with --reason "..." ,
#     the SECRETSPEC_REASON environment variable, or Secrets::with_reason()
#
# The only route through devenv is therefore the environment:
#
#   SECRETSPEC_REASON="why" ./bin/devenv machines info
#
# scripts/tailnet-preflight.sh and scripts/bb-pane-run.sh export it for you;
# an interactive `devenv machines …` typed by hand does not get it for free.
# Kept true on purpose rather than flipped to false to save typing: this was a
# deliberate choice in `~/projects/nixos` for reliable attribution, and dropping
# an audit control is not a decision to make silently while adding a credential.
# If the friction proves worse than the audit value, this one line is the toggle
# — and that is a decision, not a cleanup.
require_reason = true

[providers.dev]
uri = "onepassword+token://dev"

[profiles.default]
TS_AUTH_KEY = { description = "Tailscale auth key that enrolls the netcup host as node `nc` (tagged tag:server)", providers = ["dev"], ref = { item = "TS_AUTH_KEY", field = "credential" } }
