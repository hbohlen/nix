# secretspec.toml — the secrets this project's provisioning work resolves.
#
# Values live in the Doppler project `devenv`, config `dev`, and are read with a
# service token. This manifest holds declarations only: a name, a description,
# and the store coordinates each secret reads. Never a value.
#
# WHY THE MANIFEST IS IN THE TREE AT ALL, AND WHAT IT COSTS
# `devenv machines install` can write bootstrap files into a freshly installed
# system from SecretSpec values (`install.secrets` in devenv.nix). That is the
# only mechanism that makes the tailnet enrollment a property of the MACHINE
# rather than a step in an operator's session — and enrollment has to survive an
# unattended first boot, because the hardening change that follows will close
# public SSH.
# `secretspec.enable` stays false, so plain `machines info`/`status` do not
# require the store. Commands that explicitly resolve SecretSpec values need
# provider credentials; the install path resolves `TS_AUTH_KEY` for
# `install.secrets`.
#
# WRITE ACCESS IS PARTITIONED, NOT ABSENT (re-measured 2026-09-28 for 1Password;
# re-cut to Doppler 2026-09-30)
# The token this file's provider uses on a SecretSpec resolution path is
# `~/.config/doppler-token`, a Doppler SERVICE token pinned by Doppler to exactly
# one project and one config, created read-only. Writes happen with a separate
# service token created for the migration window with `--access read/write
# --max-age`, which expires on its own rather than relying on someone remembering
# to revoke it. SecretSpec never asks for a write on the ordinary resolution
# path; only `secretspec set`/`import`/`delete` and a Doppler-backed cache do.
# What is NOT on this provider anymore is 1Password: the `dev` vault still holds
# the SSH key, `CLOUDFLARE_API_TOKEN` and `NETCUP_CONSOLE`, read directly by
# `op` (see modules/ingress.nix and the hermes unit), and its own split between a
# read-only file token and a vault write token stands unchanged for those
# consumers.
#
# FIELD ADDRESSING USES THE ITEM'S OWN LABEL, NOT A GUESS
# The 1Password provider reads a field by its label or id, so a 1Password `ref`
# must name a field the item actually has. Measured 2026-09-27: `TS_AUTH_KEY` is
# an `API_CREDENTIAL` whose concealed field is labelled `credential`. Addressing
# it as `password` fails with
#   item 'dev/TS_AUTH_KEY' does not have a field 'password'
# Before changing any `ref`, read the item's field ids — through a filter, never
# bare, because `op item get <item> --format json` prints concealed values:
#   op item get TS_AUTH_KEY --vault dev --format json | <redacting filter>
#
# PROVIDER FORM
# Doppler is addressed as `doppler://<project>/<config>`, and the config is
# pinned in the URI on purpose: the SecretSpec profile stays `default` (the name
# README, devenv.yaml and the runbooks pass as SECRETSPEC_PROFILE), so mapping
# the profile onto the Doppler config axis would demand a `default` config that
# Doppler does not have. The URI carries nothing else — query strings and
# fragments are rejected, not ignored.
# Authentication is DOPPLER_TOKEN, which modules/shell.nix exports from
# `~/.config/doppler-token`. No `doppler` binary sits on the resolution path: the
# provider talks to `https://api.doppler.com` over REST.
#
# WHO RESOLVES THIS MANIFEST (D45, ticket 07, 2026-09-29)
# The SHELL does NOT: `secretspec.enable` is false in devenv.yaml, so
# `devenv shell`/`test` enter on the four D3 prerequisites and need neither the
# token nor a reason. Resolution is a MACHINE-path concern, opted into per
# invocation with SECRETSPEC_PROVIDER/SECRETSPEC_PROFILE. `machines install`
# resolves the tailnet key and writes `install.secrets`; `machines plan` and
# `machines apply` do not resolve or write that bootstrap file. `secretspec run`
# resolves one-off secrets such as the push token.
#
# require_reason = true
# Every access then carries an audited reason. Where that reason lands is a
# provider capability: Doppler is not one of the stores SecretSpec forwards it
# to, so the reason is recorded in SecretSpec's own audit log
# (`~/.local/state/secretspec/audit.log`, read with `secretspec audit`) and
# Doppler's activity log records the access without the client's reason.

[project]
name = "nix"
revision = "1.0"

# require_reason = true — AND WHAT IT COSTS (measured 2026-09-27, rescoped by
# D45 2026-09-29, re-attributed by ADR 0013 2026-09-30)
# Every access carries an audited reason, which is what makes the preflight and
# the store sweep attributable. Under 1Password the reason reached the vault's own
# access log; under Doppler it does not — forwarding a reason to the store is a
# provider capability (the docs name Proton Pass, not Doppler), so the attribution
# is now SecretSpec-local plus Doppler's `doppler activity`, which records that the
# config was read and by which token but carries no client reason. The cost is real
# and measured: `devenv` DOES NOT FORWARD A REASON FLAG (there is no `--reason` on
# the devenv CLI), so each invocation that resolves a SecretSpec value needs
# this environment variable. `secretspec run` and local `machines install` with
# bootstrap secrets are examples.
#
#   × Accessing secrets requires a reason. Provide one with --reason "..." ,
#     the SECRETSPEC_REASON environment variable, or Secrets::with_reason()
#
# With the integration off (D45), plain `devenv machines info` and `status` do
# not resolve the profile or need the reason.
#
# Plan/apply build/apply role outputs without writing install-time bootstrap
# files. `machines install` resolves the tailnet key for `install.secrets`.
#
# The README's `secretspec run` exports the reason. An interactive command that
# resolves a SecretSpec value needs the same environment variable.
# Kept true on purpose rather than flipped to false to save typing: this was a
# deliberate choice in `~/projects/nixos` for reliable attribution, and dropping
# an audit control is not a decision to make silently while adding a credential.
# If the friction proves worse than the audit value, this one line is the toggle
# — and that is a decision, not a cleanup.
require_reason = true

# The destination chain for every secret below. Doppler stores each value under
# its DECLARED name, verbatim, in the config named by the URI — so this alias, not
# the SecretSpec `[project].name`, is the namespace. (SecretSpec's own project name
# is unused by the Doppler provider; hermes/secretspec.toml points at this same
# `devenv/dev` and shares the namespace, exactly as both manifests shared the one
# 1Password `dev` vault before ADR 0013.)
[defaults]
providers = ["dev"]

[providers.dev]
uri = "doppler://devenv/dev"

# No `ref` on either secret: the Doppler provider stores each value under its
# declared name, verbatim, so `TS_AUTH_KEY` in Doppler is the same string as the
# key below. A 1Password-style `field` is not available at all — "Doppler secrets
# are single values with no sub-components, so `field`, `section`, `vault` and
# `version` are rejected rather than ignored."
[profiles.default]
TS_AUTH_KEY = { description = "Tailscale auth key that enrolls the netcup host as node `nc` (tagged tag:server)", providers = ["dev"] }
GH_TOKEN = { description = "Classic GitHub PAT (`ghp_`, no read:org) for host-side `gh` API work and a future private flip; resolved per use, never at rest", providers = ["dev"] }
