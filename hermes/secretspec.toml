# hermes/secretspec.toml — the secrets that render $HERMES_HOME/.env.
#
# Declarations only: a name, a description, and the 1Password item each
# secret reads. Never a value (ADR 0007). Values live in the `dev` vault.
#
# WHO RESOLVES THIS MANIFEST
# NOT devenv. `hermes/devenv.yaml` carries `secretspec.enable: false`, because
# measured 2026-09-30 the integration resolves the profile at EVERY command
# load when enabled — tokenless shells die at the provider gate — and nothing
# in the Nix evaluation needs a secret value:
# docs/research/2026-09-30-secretspec-enable-not-portable.md. This manifest
# is consumed by ONE imperative step instead, run from ~/nix/hermes:
#
#   OP_SERVICE_ACCOUNT_TOKEN=$(cat ~/.config/op-sa-token) \\
#     SECRETSPEC_REASON="hermes: render HERMES_HOME/.env" \\
#     secretspec export --format dotenv > .hermes/.env && chmod 0600 .hermes/.env
#
# The upstream module cats this file into $HERMES_HOME/.env at activation
# (`mkEnvScript`, moduleCommon.nix), and hermes re-reads it at every start
# (`load_hermes_dotenv()`). Secrets reach runtime through the FILE, never
# through the generation or the store.
#
# WHY PER-KEY REFS RATHER THAN A COMPOSED HERMES_ENV_FILE SECRET
# The ticket sketch offered either shape. A single-file secret would store
# the whole .env inside 1Password: a second copy of content that already
# lives on disk, to keep in sync forever. Per-key refs read items the vault
# ALREADY has; the dotenv export composes the file on demand, and git never
# sees it (/hermes/.hermes/.env, ticket 04).
#
# WHAT IS DELIBERATELY NOT HERE
# * The non-secret knobs of the live ~/.hermes/.env (TERMINAL_TIMEOUT=60,
#   TERMINAL_LIFETIME_SECONDS, API_SERVER_ENABLED=true, WEBHOOK_ENABLED=true,
#   BROWSER*_*, *_DEBUG flags, YANTRIKDB_*, WIKI_PATH, GLM_BASE_URL,
#   COMMANDCODE_BASE_URL, OPENCODE_GO_BASE_URL). They are settings, not
#   secrets: they belong in modules/settings.nix (the gateway/terminal/
#   web keys of config.yaml) or services.hermes-agent.environment.
#   Duplicating them here creates two sources for one value. T-08 verifies
#   per key that hermes reads what it needs from config.yaml.
# * SUDO_PASSWORD. It sat in the live .env in plaintext. Moving it into a
#   tracked manifest by inertia is not a migration; if hermes genuinely
#   needs it, T-08 decides where it belongs and it joins this list with
#   no echo anywhere else.
# * Items with no vault entry yet (GLM_API_KEY, ANTHROPIC_API_KEY,
#   COMMANDCODE_API_KEY, TAVILY_API_KEY). Declared anyway, required =
#   false, so `secretspec check` NAMES the gap instead of silently
#   rendering a partial .env. Creating them is the write-token step in
#   the runbook (D-01).
# * ANTHROPIC_TOKEN and OPENCODE_ZEN_API_KEY: present in the live .env,
#   absent from the vault AND absent from the live config.yaml routing.
#   Whether hermes still uses them is a T-08 question; until answered they
#   stay out of the manifest rather than in an unexplained list.

[project]
name = "hermes"
revision = "1.0"

# Same audit rule as the root manifest: every access carries a reason.
require_reason = true

# The same 1Password service-account form as the root [providers.dev].
# Provider/profile are aliases + URI schemes, not secrets.
[providers.dev]
uri = "onepassword+token://dev"

[profiles.default]
HERMES_CUSTOM_API_LONGCAT_CHAT_API_KEY = { description = "LongCat chat key, named the way hermes reads it. settings.nix custom_providers[].key_env names exactly this variable, and `secretspec export --format dotenv` writes the declared name verbatim with no alias option (measured in --help), so this key IS the name in $HERMES_HOME/.env. The previous key LONGCAT_API_KEY is read by nothing in hermes (it never appears in the source; key_env is looked up in os.environ).", providers = ["dev"], required = false, ref = { item = "LONGCAT", field = "api_key" } }
OPENCODE_GO_API_KEY = { description = "opencode-go provider key -> OPENCODE_GO_API_KEY in $HERMES_HOME/.env", providers = ["dev"], required = false, ref = { item = "OPENCODE_GO_PROVIDER", field = "credential" } }
GLM_API_KEY         = { description = "GLM (Zhipu) key -> GLM_API_KEY. VAULT ITEM MISSING - create before first render (runbook D-01)", providers = ["dev"], required = false, ref = { item = "GLM_API_KEY", field = "credential" } }
ANTHROPIC_API_KEY   = { description = "Anthropic key -> ANTHROPIC_API_KEY. VAULT ITEM MISSING - create before first render (runbook D-01)", providers = ["dev"], required = false, ref = { item = "ANTHROPIC_API_KEY", field = "credential" } }
COMMANDCODE_API_KEY = { description = "CommandCode key -> COMMANDCODE_API_KEY. VAULT ITEM MISSING - create before first render (runbook D-01)", providers = ["dev"], required = false, ref = { item = "COMMANDCODE_API_KEY", field = "credential" } }
TAVILY_API_KEY      = { description = "Tavily web-search key -> TAVILY_API_KEY. VAULT ITEM MISSING - create before first render (runbook D-01)", providers = ["dev"], required = false, ref = { item = "TAVILY_API_KEY", field = "credential" } }
