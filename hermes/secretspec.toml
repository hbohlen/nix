# hermes/secretspec.toml — the secrets that render $HERMES_HOME/.env.
#
# Declarations only: a name and a description. Never a value (ADR 0007). Values
# live in the Doppler project `devenv`, config `dev`, under the declared names.
#
# WHO RESOLVES THIS MANIFEST
# NOT devenv. `hermes/devenv.yaml` carries `secretspec.enable: false`, because
# measured 2026-09-30 the integration resolves the profile at EVERY command
# load when enabled — tokenless shells die at the provider gate — and nothing
# in the Nix evaluation needs a secret value:
# docs/research/2026-09-30-secretspec-enable-not-portable.md. This manifest
# is consumed by ONE imperative step instead, run from ~/nix/hermes:
#
#   DOPPLER_TOKEN=$(cat ~/.config/doppler-token) \\
#     SECRETSPEC_REASON="hermes: render HERMES_HOME/.env" \\
#     secretspec export --format dotenv > .hermes/.env && chmod 0600 .hermes/.env
#
# (modules/shell.nix exports DOPPLER_TOKEN for a devenv shell, so the prefix is
# only needed in a bare one.)
#
# The upstream module cats this file into $HERMES_HOME/.env at activation
# (`mkEnvScript`, moduleCommon.nix), and hermes re-reads it at every start
# (`load_hermes_dotenv()`). Secrets reach runtime through the FILE, never
# through the generation or the store.
#
# WHY PER-KEY SECRETS RATHER THAN A COMPOSED HERMES_ENV_FILE SECRET
# The ticket sketch offered either shape. A single-file secret would store
# the whole .env inside the secret store: a second copy of content that already
# lives on disk, to keep in sync forever. Per-key declarations read values the
# store ALREADY has; the dotenv export composes the file on demand, and git never
# sees it (/hermes/.hermes/.env, ticket 04).
#
# WHAT IS DELIBERATELY NOT HERE
# * The non-secret knobs of the live ~/.hermes/.env (TERMINAL_TIMEOUT=60,
#   TERMINAL_LIFETIME_SECONDS, API_SERVER_ENABLED=true, WEBHOOK_ENABLED=true,
#   BROWSER*_*, *_DEBUG flags, YANTRIKDB_*, WIKI_PATH, GLM_BASE_URL,
#   COMMANDCODE_BASE_URL, OPENCODE_GO_BASE_URL). They are settings, not
#   secrets: they belong in modules/settings.nix (the gateway/terminal/
#   web keys of config.yaml) or services.hermes-agent.environment.
#   Duplicating them here creates two sources for one value. T-08 verifies
#   per key that hermes reads what it needs from config.yaml.
# * SUDO_PASSWORD. It sat in the live .env in plaintext. Moving it into a
#   tracked manifest by inertia is not a migration; if hermes genuinely
#   needs it, T-08 decides where it belongs and it joins this list with
#   no echo anywhere else.
# * Names with no stored value yet (GLM_API_KEY, ANTHROPIC_API_KEY,
#   COMMANDCODE_API_KEY, TAVILY_API_KEY). Declared anyway, required =
#   false, so `secretspec check` NAMES the gap instead of silently
#   rendering a partial .env. Creating them is the write-token step in
#   the runbook (D-01). The op -> Doppler migration re-measured this on
#   2026-09-30: `secretspec import op` reported exactly these four as
#   "not found in source", so no value was lost by leaving the vault —
#   there was never one to carry.
# * ANTHROPIC_TOKEN and OPENCODE_ZEN_API_KEY: present in the live .env,
#   absent from the store AND absent from the live config.yaml routing.
#   Whether hermes still uses them is a T-08 question; until answered they
#   stay out of the manifest rather than in an unexplained list.

[project]
name = "hermes"
revision = "1.0"

# Same audit rule as the root manifest: every access carries a reason.
require_reason = true

# The same Doppler store as the root manifest: project `devenv`, config `dev`,
# pinned in the URI so the SecretSpec profile `default` needs no matching Doppler
# config. Provider/profile are aliases + URI schemes, not secrets.
#
# This shares ONE namespace with the root manifest — "SecretSpec's own project name
# is unused: the Doppler project in the URI provides the namespace" — which is the
# shape the two manifests already had inside the single 1Password `dev` vault. The
# key sets do not overlap, so nothing collides; it is recorded here because a new
# secret named TS_AUTH_KEY in hermes would silently read the root manifest's value.
[defaults]
providers = ["dev"]

[providers.dev]
uri = "doppler://devenv/dev"

# Each value lands in Doppler under its DECLARED name, verbatim — the vault's
# `LONGCAT`/`api_key` pair became HERMES_CUSTOM_API_LONGCAT_CHAT_API_KEY. That is
# the name `secretspec export --format dotenv` already wrote and the name
# settings.nix `key_env` reads, so the render path is unchanged. A secret with no
# `ref` is simply looked up by that declared name; Doppler rejects a 1Password-style
# `field` outright, so the item/field coordinates this manifest used before ADR
# 0013 have no Doppler equivalent to keep.
[profiles.default]
HERMES_CUSTOM_API_LONGCAT_CHAT_API_KEY = { description = "LongCat chat key, named the way hermes reads it. settings.nix custom_providers[].key_env names exactly this variable, and `secretspec export --format dotenv` writes the declared name verbatim with no alias option (measured in --help), so this key IS the name in $HERMES_HOME/.env. The previous key LONGCAT_API_KEY is read by nothing in hermes (it never appears in the source; key_env is looked up in os.environ).", providers = ["dev"], required = false }
OPENCODE_GO_API_KEY = { description = "opencode-go provider key -> OPENCODE_GO_API_KEY in $HERMES_HOME/.env", providers = ["dev"], required = false }
GLM_API_KEY         = { description = "GLM (Zhipu) key -> GLM_API_KEY. NOT IN DOPPLER - create before first render (runbook D-01)", providers = ["dev"], required = false }
ANTHROPIC_API_KEY   = { description = "Anthropic key -> ANTHROPIC_API_KEY. NOT IN DOPPLER - create before first render (runbook D-01)", providers = ["dev"], required = false }
COMMANDCODE_API_KEY = { description = "CommandCode key -> COMMANDCODE_API_KEY. NOT IN DOPPLER - create before first render (runbook D-01)", providers = ["dev"], required = false }
TAVILY_API_KEY      = { description = "Tavily web-search key -> TAVILY_API_KEY. NOT IN DOPPLER - create before first render (runbook D-01)", providers = ["dev"], required = false }
