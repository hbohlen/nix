# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# Inputs and SecretSpec configuration for the netcup build.
#
# THE SHELL DOES NOT RESOLVE SECRETSPEC; THE MACHINE PATH DOES (ticket 07, D45,
# 2026-09-29). `secretspec.enable` is FALSE on purpose. D3 says the shell layer
# must run with only the four prerequisites and nothing else; with the
# integration on, `devenv shell`/`test` resolved the profile at activation and
# died at the 1Password gate without a vault credential (measured: "OnePassword
# authentication required"). With it off, a TOKENLESS `devenv test` is green,
# and no shell tool needs a manifest secret. The vault is a MACHINE concern:
# `install.secrets` puts the tailnet auth key on the host during
# `machines install`, and the machines commands carry their own SecretSpec
# options, so provider and profile are selected PER INVOCATION:
#
#   SECRETSPEC_PROVIDER=dev SECRETSPEC_PROFILE=default devenv machines …
#
# (`--secretspec-provider/--secretspec-profile` are equivalent; README.md's
# deploy loop uses the env form.) `provider` and `profile` are ALIASES matching
# the [providers.*] and [profiles.*] entries in secretspec.toml, not URIs.
# Local resolution is what streams the value to the target over authenticated
# SSH; target execution would instead need the 1Password provider reachable from
# the temporary kexec'd installer, a service-account token on a throwaway host.
#
# ADD INPUTS BY HAND. `devenv inputs add` rewrites this file and drops every
# comment in it (measured 2026-09-27).
#
# allow_unfree — REQUIRED BY THE HOST'S `op`, AND WHY IT IS DECLARED HERE.
# The host's self-deploy module puts the 1Password CLI on the machine
# (`pkgs._1password-cli`, mainProgram `op`), because SecretSpec's 1Password
# provider is a wrapper around the `op` binary and resolves nothing without it.
# That package is unfree, and a Machine module may NOT set `nixpkgs.config`:
# devenv builds `pkgs` outside the module system and passes
# `pkgs = inputs.nixpkgs.legacyPackages.<system>`, so writing nixpkgs.config in a
# module fails eval with "Your system configures nixpkgs with an externally
# created instance" — measured. This is the documented route. It is declared
# rather than left to `NIXPKGS_ALLOW_UNFREE` in
# an operator's environment, for the reason design D6 gives: an ambient setting
# is missing whenever a script or another operator runs the command.
allow_unfree: true

# THE SHELL TYPE, AND WHY IT IS DECLARED HERE RATHER THAN IN A MODULE.
# The pinned 2.4.0 resolves the shell in this order (measured in
# `devenv-core/src/settings.rs`): `devenv.yaml`'s `shell:` first, then the
# hook's `_DEVENV_SHELL_HINT`, then `$SHELL`, then the login shell, then bash.
# Declaring it here is therefore the highest-priority source, and it beats the
# zsh hook on the workstation on purpose: zsh stays the OS login shell, and nu
# becomes the shell INSIDE the project (D26, D29).
#
# An unsupported VALUE falls back to bash with a warning. A missing BINARY does
# not, which is why modules/shell.nix declares `nushell` as a package instead of
# trusting the fallback (Q3b).
shell: nu

# The running CLI and the locked modules must agree. Bare `devenv` is 2.4.0 —
# the workstation's nix profile installs it (`nix profile install
# nixpkgs#devenv`), Home Manager installs it on netcup
# (hosts/netcup/cli.nix) — and it matches the locked `devenv` node. Making
# that a hard requirement turns the wrong-binary failure from a late,
# confusing eval error (`Failed to get attribute
# 'devenv.config.machinesMeta'`) into a version boundary.
require_version: true

# OFF, so the shell enters without the vault (D45). The machines commands turn
# it on for themselves with the env vars documented above.
secretspec:
  enable: false

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

  # Pinned to the SAME release tag as the `devenv` CLI on PATH (2.4.0). The module source
  # that defines `machines`/`machinesMeta` comes from this lock node, not from
  # the binary, and the two must agree: the 2.4.0 binary against an older locked
  # rev fails with "Failed to get attribute 'devenv.config.machinesMeta'", and
  # a bare `devenv update` silently moves this node to the default branch
  # (measured 2026-09-27: it resolved to main's bd08a52, a commit the pinned
  # binary was never built against). Keep it on the release tag.
  devenv:
    url: github:cachix/devenv/v2.4.0?dir=src/modules

  # disko — MANDATORY for every NixOS machine, deploy-only ones included:
  # devenv imports `disko.nixosModules.disko` itself and exposes no disko
  # option, so the layout can only come from our own module
  # (hosts/netcup/disko.nix). The missing-input error is lazy.
  #
  # The `inputs.nixpkgs.follows` nesting is REQUIRED — it is what
  # `devenv inputs add disko … --follows nixpkgs` writes. The flat
  # `follows: nixpkgs` form silently locks disko as an ALIAS of the nixpkgs
  # node instead of adding a disko node at all (measured 2026-09-27: root
  # inputs showed `"disko": ["nixpkgs"]` and eval failed with
  # `error: attribute 'disko' missing`).
  disko:
    url: github:nix-community/disko
    inputs:
      nixpkgs:
        follows: nixpkgs

  # Required by machines.netcup.home-manager. Follow the root nixpkgs input.
  home-manager:
    url: github:nix-community/home-manager
    inputs:
      nixpkgs:
        follows: nixpkgs

  # llm-agents provides the agent CLIs and dsh packages used by the shell layer.
  # Netcup's Home Manager role installs only the pinned devenv CLI.
  # NOT in nixpkgs, and absent from both caches this host declared until now.
  #
  # IT DELIBERATELY DOES NOT FOLLOW nixpkgs (design D2). llm-agents.nix is only
  # built and tested against its own pinned `nixpkgs-unstable`, and its README
  # measures that `follows: nixpkgs` costs the binary-cache hits: this Machine's
  # nixpkgs is devenv-nixpkgs/rolling (a different revision), so the prebuilt
  # packages would stop substituting and compile instead (npm + two Rust/PyO3
  # extensions + zig/libghostty — hours, on whichever machine runs the build).
  # Omitting `follows` brings a SECOND nixpkgs into the closure graph on purpose;
  # design R1 measures the cost, and the numtide cache declared in
  # hosts/netcup/self-deploy.nix is what keeps it a download.
  #
  # Pinned in devenv.lock at the rev the planning measured
  # (e28ea84e…, 2026-09-28). Update by name only — `devenv inputs update
  # llm-agents` — never bare `devenv update` (see the `devenv:` block above).
  llm-agents:
    url: github:numtide/llm-agents.nix
