# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# Inputs and SecretSpec configuration for the netcup build.
#
# SECRETSPEC IS IN THE TREE NOW (2026-09-27), so THE VAULT IS ON THE `machines`
# PATH. Every `devenv machines` invocation — read-only `info` included —
# resolves the whole secretspec profile when a manifest is present (the previous
# build measured `machines info` refusing to run until all six of its declared
# secrets resolved; re-measured here). The install milestone deliberately kept
# the manifest out of the tree to keep the vault off the install path. The
# tailnet change puts ONE secret on that path and accepts the coupling, because
# `install.secrets` is the only mechanism that makes the enrollment a property
# of the machine rather than of an operator's session.
#
# The `secretspec` block below is what makes LOCAL execution work: devenv
# resolves the value on this workstation and streams it to the target over
# authenticated SSH. Target execution would instead require the 1Password
# provider to be reachable from the temporary kexec'd installer — a
# service-account token on a throwaway host, for no benefit here.
#
# `provider` and `profile` are ALIASES matching the [providers.*] and
# [profiles.*] entries in secretspec.toml, not URIs. Rename one without the
# other and every `machines` command fails.
#
# ADD INPUTS BY HAND. `devenv inputs add` rewrites this file and drops every
# comment in it (measured 2026-09-27).
#
# allow_unfree — REQUIRED BY THE HOST'S `op`, AND WHY IT IS DECLARED HERE.
# The host's self-deploy module puts the 1Password CLI on the machine
# (`pkgs._1password-cli`, mainProgram `op`), because SecretSpec's 1Password
# provider is a wrapper around the `op` binary and resolves nothing without it.
# That package is unfree, and a Machine module may NOT set `nixpkgs.config`:
# devenv builds `pkgs` outside the module system and passes
# `pkgs = inputs.nixpkgs.legacyPackages.<system>`, so writing nixpkgs.config in a
# module fails eval with "Your system configures nixpkgs with an externally
# created instance" — measured, and recorded in openspec/config.yaml. This is the
# documented route. It is declared rather than left to `NIXPKGS_ALLOW_UNFREE` in
# an operator's environment, for the reason design D6 gives: an ambient setting
# is missing whenever a script or another operator runs the command.
allow_unfree: true

secretspec:
  enable: true
  provider: dev
  profile: default

inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

  # Pinned to the SAME commit as the binary in bin/devenv. The module source
  # that defines `machines`/`machinesMeta` comes from this lock node, not from
  # the binary, and the two must agree: the 2.4.0 binary against an older locked
  # rev fails with "Failed to get attribute 'devenv.config.machinesMeta'", and
  # a bare `devenv update` silently moves this node to the default branch
  # (measured 2026-09-27: it resolved to main's bd08a52, a commit the pinned
  # binary was never built against). Keep it on the release tag.
  devenv:
    url: github:cachix/devenv/v2.4.0?dir=src/modules

  # disko — MANDATORY for every NixOS machine, deploy-only ones included:
  # devenv imports `disko.nixosModules.disko` itself and exposes no disko
  # option, so the layout can only come from our own module
  # (hosts/netcup/disko.nix). The missing-input error is lazy.
  #
  # The `inputs.nixpkgs.follows` nesting is REQUIRED — it is what
  # `devenv inputs add disko … --follows nixpkgs` writes. The flat
  # `follows: nixpkgs` form silently locks disko as an ALIAS of the nixpkgs
  # node instead of adding a disko node at all (measured 2026-09-27: root
  # inputs showed `"disko": ["nixpkgs"]` and eval failed with
  # `error: attribute 'disko' missing`).
  disko:
    url: github:nix-community/disko
    inputs:
      nixpkgs:
        follows: nixpkgs

  # home-manager — the operator account's user environment on the host
  # (`machines.netcup.home-manager`, hosts/netcup/operator.nix). MANDATORY once
  # that role is declared: devenv's machines module reads it lazily and, if the
  # input is absent, fails eval with a targeted error naming
  # `machines.<name>.home-manager`. The URL and the `follows: nixpkgs` nesting
  # are copied from `homeManagerInputArgs` in devenv 2.4.0's machines.nix, and
  # the nesting is the same one the disko block above explains — the flat
  # `follows: nixpkgs` form silently locks the input as an alias instead of a
  # node.
  #
  # It floats on master until `devenv.lock` pins it. Risk R2: master may not
  # pair with devenv-nixpkgs/rolling, which home-manager warns about through
  # `home.enableNixpkgsReleaseCheck`. If eval warns or breaks, pin this URL to
  # the release branch matching `system.stateVersion = "26.11"`, or disable the
  # check with the reason written down (design R2).
  home-manager:
    url: github:nix-community/home-manager
    inputs:
      nixpkgs:
        follows: nixpkgs

  # llm-agents — the agent tooling the operator account carries
  # (`hermes-agent` + `herdr`, hosts/netcup/agents.nix). NOT in nixpkgs, and
  # absent from both caches this host declared until now.
  #
  # IT DELIBERATELY DOES NOT FOLLOW nixpkgs (design D2). llm-agents.nix is only
  # built and tested against its own pinned `nixpkgs-unstable`, and its README
  # measures that `follows: nixpkgs` costs the binary-cache hits: this Machine's
  # nixpkgs is devenv-nixpkgs/rolling (a different revision), so the prebuilt
  # packages would stop substituting and compile instead (npm + two Rust/PyO3
  # extensions + zig/libghostty — hours, on whichever machine runs the build).
  # Omitting `follows` brings a SECOND nixpkgs into the closure graph on purpose;
  # design R1 measures the cost, and the numtide cache declared in
  # hosts/netcup/self-deploy.nix is what keeps it a download.
  #
  # Pinned in devenv.lock at the rev the planning measured
  # (e28ea84e…, 2026-09-28). Update by name only — `devenv inputs update
  # llm-agents` — never bare `devenv update` (see the `devenv:` block above).
  llm-agents:
    url: github:numtide/llm-agents.nix
